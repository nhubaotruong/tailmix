[package]
name = "tailmix-gui"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license = "BSD-3-Clause"
description = "GNOME frontend for tailmix"
publish = false

[dependencies]
adw = { package = "libadwaita", version = "0.9", features = ["v1_6"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_10"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
glib-build-tools = "0.22"
